<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>BusinessPilot AI | Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">


    <style>

        * {
            font-family: 'Poppins', sans-serif;
        }

        body {

            background: #020617;

            color: white;

            overflow: hidden;

        }

        body::before {

            content: "";

            position: fixed;

            width: 700px;

            height: 700px;

            background:
                radial-gradient(
                    circle,
                    #06b6d455,
                    transparent
                );

            top: -250px;

            left: -250px;

            pointer-events: none;

        }

        body::after {

            content: "";

            position: fixed;

            width: 700px;

            height: 700px;

            background:
                radial-gradient(
                    circle,
                    #2563eb44,
                    transparent
                );

            bottom: -250px;

            right: -250px;

            pointer-events: none;

        }

        .glass {

            background:
                rgba(255,255,255,.05);

            backdrop-filter:
                blur(20px);

            border:
                1px solid
                rgba(255,255,255,.08);

        }

        .login-card {

            animation:
                fade .7s ease;

        }

        @keyframes fade {

            from {

                opacity: 0;

                transform:
                    translateY(40px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }

        .btn {

            background:
                linear-gradient(
                    90deg,
                    #06b6d4,
                    #2563eb
                );

            transition: .35s;

        }

        .btn:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 15px 30px
                rgba(6,182,212,.35);

        }

        .btn:disabled {

            opacity: .6;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;

        }

        input {

            background: #0f172a;

        }

    </style>

<script src="../assets/js/api-config.js"></script>
</head>


<body>


<div
    class="min-h-screen flex items-center justify-center p-6">


    <div
        class="login-card glass rounded-3xl w-full max-w-md p-10">


        <!-- LOGO -->

        <div class="text-center">

            <div
                class="mx-auto w-20 h-20 rounded-2xl
                bg-gradient-to-r from-cyan-400 to-blue-600
                flex justify-center items-center
                text-3xl font-bold">

                AI

            </div>


            <h1
                class="text-3xl font-bold mt-6">

                BusinessPilot AI

            </h1>


            <p
                class="text-gray-400 mt-2">

                Sign in to continue

            </p>

        </div>


        <!-- LOGIN FORM -->

        <form
            id="loginForm"
            class="mt-10">


            <!-- Username -->

            <div>

                <label
                    class="text-sm text-gray-300">

                    Username

                </label>


                <div
                    class="relative mt-2">


                    <i
                        class="fa-solid fa-user
                        absolute left-4 top-1/2
                        -translate-y-1/2
                        text-gray-500">
                    </i>


                    <input
                        id="username"
                        type="text"
                        autocomplete="username"
                        placeholder="Username"
                        required
                        class="w-full rounded-xl py-4 pl-12 pr-4
                        border border-slate-700
                        focus:border-cyan-400
                        outline-none">

                </div>

            </div>


            <!-- Password -->

            <div class="mt-6">

                <label
                    class="text-sm text-gray-300">

                    Password

                </label>


                <div
                    class="relative mt-2">


                    <i
                        class="fa-solid fa-lock
                        absolute left-4 top-1/2
                        -translate-y-1/2
                        text-gray-500">
                    </i>


                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="********"
                        required
                        class="w-full rounded-xl py-4 pl-12 pr-12
                        border border-slate-700
                        focus:border-cyan-400
                        outline-none">


                    <button
                        type="button"
                        id="togglePassword"
                        class="absolute right-4 top-1/2
                        -translate-y-1/2
                        text-gray-400">

                        <i
                            class="fa-solid fa-eye">
                        </i>

                    </button>

                </div>

            </div>


            <!-- Remember -->

            <div
                class="flex items-center justify-between
                mt-6 text-sm">


                <label
                    class="flex items-center gap-2
                    cursor-pointer">


                    <input
                        id="rememberMe"
                        type="checkbox"
                        class="accent-cyan-500">


                    <span
                        class="text-gray-400">

                        Remember me

                    </span>

                </label>


                <a
                    href="#"
                    class="text-cyan-400
                    hover:text-cyan-300">

                    Forgot Password?

                </a>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                id="loginButton"
                type="submit"
                class="btn w-full py-4 rounded-xl
                mt-8 font-semibold text-lg">


                <i
                    class="fa-solid fa-right-to-bracket mr-2">
                </i>

                Sign In

            </button>


            <!-- STATUS -->

            <p
                id="loginStatus"
                class="text-center
                text-sm mt-4
                text-gray-400">
            </p>


            <!-- DIVIDER -->

            <div
                class="flex items-center gap-4 my-8">

                <div
                    class="flex-1 h-px
                    bg-slate-700">
                </div>

                <span
                    class="text-gray-500 text-sm">

                    OR

                </span>

                <div
                    class="flex-1 h-px
                    bg-slate-700">
                </div>

            </div>


            <!-- GOOGLE -->

            <button
                type="button"
                class="w-full border border-slate-700
                rounded-xl py-4
                hover:bg-slate-800
                transition">


                <i
                    class="fa-brands fa-google mr-2">
                </i>

                Continue with Google

            </button>


            <!-- REGISTER -->

            <p
                class="text-center
                text-gray-400 mt-8">


                Don't have an account?


                <a
                    href="register.html"
                    class="text-cyan-400
                    hover:text-cyan-300
                    font-semibold">

                    Create Account

                </a>

            </p>

        </form>

    </div>

</div>


<script>


/* =========================================
   BUSINESSPILOT API
========================================= */

const IS_LOCAL_FRONTEND = window.location.protocol === "file:" || window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
const API_URL = window.BUSINESSPILOT_API_URL || (IS_LOCAL_FRONTEND ? "http://localhost:8000" : "https://businesspilot-ai-backend.onrender.com");


/* =========================================
   ELEMENTS
========================================= */

const loginForm =
    document.getElementById(
        "loginForm"
    );

const username =
    document.getElementById(
        "username"
    );

const password =
    document.getElementById(
        "password"
    );

const togglePassword =
    document.getElementById(
        "togglePassword"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const loginStatus =
    document.getElementById(
        "loginStatus"
    );


/* =========================================
   PASSWORD SHOW / HIDE
========================================= */

togglePassword.addEventListener(
    "click",
    function () {

        if (
            password.type ===
            "password"
        ) {

            password.type =
                "text";

            togglePassword.innerHTML =
                '<i class="fa-solid fa-eye-slash"></i>';

        }

        else {

            password.type =
                "password";

            togglePassword.innerHTML =
                '<i class="fa-solid fa-eye"></i>';

        }

    }
);


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const usernameValue =
            username.value.trim();

        const passwordValue =
            password.value;


        /* Check input */

        if (
            !usernameValue ||
            !passwordValue
        ) {

            loginStatus.textContent =
                "กรุณากรอก Username และ Password";

            loginStatus.className =
                "text-center text-sm mt-4 text-red-400";

            return;

        }


        /* Disable button */

        loginButton.disabled =
            true;

        loginButton.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Signing In...';


        loginStatus.textContent =
            "กำลังเข้าสู่ระบบ...";

        loginStatus.className =
            "text-center text-sm mt-4 text-cyan-400";


        try {


            /* =================================
               CALL RENDER BACKEND
            ================================= */

            const response =
                await fetch(
                    `${API_URL}/login`,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                username:
                                    usernameValue,

                                password:
                                    passwordValue

                            })

                    }
                );


            /* Get response */

            let result = {};

            try {

                result =
                    await response.json();

            }

            catch (error) {

                result = {};

            }


            /* =================================
               ERROR
            ================================= */

            if (!response.ok) {

                let message =
                    "Username หรือ Password ไม่ถูกต้อง";


                if (
                    typeof result.detail ===
                    "string"
                ) {

                    message =
                        result.detail;

                }

                else if (
                    Array.isArray(
                        result.detail
                    )
                ) {

                    message =
                        result.detail
                            .map(
                                item =>
                                    item.msg || ""
                            )
                            .join(", ");

                }


                throw new Error(
                    message
                );

            }


            /* =================================
               TOKEN
            ================================= */

            if (
                !result.access_token
            ) {

                throw new Error(
                    "Backend ไม่ได้ส่ง access_token กลับมา"
                );

            }


            localStorage.setItem(
                "access_token",
                result.access_token
            );


            /* =================================
               USER
            ================================= */

            if (result.user) {

                localStorage.setItem(
                    "user",
                    JSON.stringify(
                        result.user
                    )
                );

            }


            /* =================================
               API URL
            ================================= */

            localStorage.setItem(
                "api_url",
                API_URL
            );


            /* =================================
               SUCCESS
            ================================= */

            loginStatus.textContent =
                "เข้าสู่ระบบสำเร็จ!";

            loginStatus.className =
                "text-center text-sm mt-4 text-green-400";


            /* =================================
               GO TO UPLOAD
            ================================= */

            setTimeout(
                function () {

                    window.location.href =
                        "upload_data.html";

                },
                500
            );


        }

        catch (error) {


            console.error(
                "LOGIN ERROR:",
                error
            );


            if (
                error.message
                    .toLowerCase()
                    .includes(
                        "failed to fetch"
                    )
            ) {

                loginStatus.textContent =
                    "ไม่สามารถเชื่อมต่อ Backend ได้";

            }

            else {

                loginStatus.textContent =
                    error.message;

            }


            loginStatus.className =
                "text-center text-sm mt-4 text-red-400";


            loginButton.disabled =
                false;


            loginButton.innerHTML =
                '<i class="fa-solid fa-right-to-bracket mr-2"></i> Sign In';

        }

    }
);

</script>

</body>

</html>
